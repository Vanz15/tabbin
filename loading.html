<!doctype html><html><head><meta charset="UTF-8"><title>Tabbin</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Inter,Segoe UI,sans-serif}.card{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;border-radius:24px;background:#171922ee;color:#fff;box-shadow:0 18px 50px #0008}.logo{width:132px;height:132px;display:block}.wordmark{font-size:22px;font-weight:700;letter-spacing:.4px}.loading{display:flex;align-items:center;gap:8px;color:#ffffffa8;font-size:12px}.dot{width:6px;height:6px;border-radius:50%;background:#8fbfe0;animation:pulse 1s infinite ease-in-out}.dot:nth-child(2){animation-delay:.16s}.dot:nth-child(3){animation-delay:.32s}@keyframes pulse{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}</style></head><body><main class="card"><svg class="logo" viewBox="35 55 250 245" aria-label="Tabbin logo"><rect x="45" y="70" width="230" height="48" rx="11" fill="#8FBFE0"/><rect x="45" y="126" width="130" height="48" rx="11" fill="#F2B84B"/><rect x="45" y="182" width="130" height="48" rx="11" fill="#7FC8A9"/><rect x="45" y="238" width="130" height="48" rx="11" fill="#E08B7D"/></svg><div class="wordmark">Tabbin</div><div class="loading">Starting Tabbin <span class="dot"></span><span class="dot"></span><span class="dot"></span></div></main></body></html>

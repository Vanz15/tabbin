<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Tabbin Notes</title>
    <style>
      /* Geist, bundled rather than hotlinked, for the same reason as the dock:
         a font CDN stalls on a slow link and shows a fallback face when offline.
         Declared per renderer because each one loads through its own loadFile
         document with no shared stylesheet, so this is a deliberate copy of
         dock.html's block rather than a missed extraction. Geist ships as a
         variable font, so one 29 KB file covers every weight used here. */
      @font-face {
        font-family: "Geist";
        src: url("fonts/Geist-Variable.woff2") format("woff2-variations");
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }
      /* Optional note fonts, bundled for the same reason as Geist: no CDN, no
         user install, and identical rendering offline. All four are SIL OFL
         1.1 (texts in fonts/licenses/). Weights come from one variable file
         each, except Parisienne, which has a single static weight; italic is
         synthesised, as it already was for Geist. */
      @font-face {
        font-family: "Inter";
        src: url("fonts/Inter-Variable.woff2") format("woff2-variations");
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: "Public Sans";
        src: url("fonts/PublicSans-Variable.woff2") format("woff2-variations");
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: "Gelasio";
        src: url("fonts/Gelasio-Variable.woff2") format("woff2-variations");
        font-weight: 400 700;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: "Parisienne";
        src: url("fonts/Parisienne-Regular.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      /* Legacy: notes saved while Caveat was offered keep a script face. */
      @font-face {
        font-family: "Caveat";
        src: url("fonts/Parisienne-Regular.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      /* Frosted-glass note window, ported from the design mockup's `.win`.
         The window is frameless and translucent, so this page paints the whole
         surface: the OS acrylic supplies the blur, these tokens the tint.
         Segoe UI stays in the chain as the floor if the font ever fails. */
      :root {
        --glass-line: rgba(255, 255, 255, 0.09);
        --glass-hi: rgba(255, 255, 255, 0.06);
        --ink: #f4f4f5;
        --ink2: #b4b4bc;
        --ink3: #76767e;
        --c: #8ec5e8;
        /* Title face only. Body text gets its font inline, per selection. */
        --title-font: "Geist";
        /* Base body size. Drives the editor default and the title (x1.5). */
        --note-size: 14px;
        font-family:
          "Geist",
          "Segoe UI",
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        /* Transparent so the acrylic behind the window shows through. */
        background: transparent !important;
        color: var(--ink);
        overflow: hidden;
        font-family:
          "Geist",
          "Segoe UI",
          sans-serif;
      }
      body::-webkit-scrollbar,
      .wrap::-webkit-scrollbar,
      .editor::-webkit-scrollbar {
        width: 0;
        height: 0;
      }
      .wrap {
        height: 100vh;
        display: flex;
        flex-direction: column;
        /* The window is now fully transparent (transparent:true + alpha 0), so the
           CSS here paints the entire visible surface — this is what lets the
           clip-path cut genuine rounded corners against the desktop and makes the
           colour spine reach the edge. An opaque gradient base fills the surface
           so Chromium never leaves an uninitialised white region to ghost. */
        clip-path: inset(0 round 16px);
        background: linear-gradient(
            180deg,
            color-mix(in srgb, var(--c) 17%, transparent),
            transparent 42%
          ),
          #18181b;
        border: 1px solid var(--glass-line);
        box-shadow:
          inset 0 1px 0 var(--glass-hi),
          0 24px 60px rgba(0, 0, 0, 0.45),
          0 2px 8px rgba(0, 0, 0, 0.3);
        overflow: hidden;
      }
      /* Classic mode: the note window is a solid sheet of the note colour with
         dark ink, matching the classic dock tiles. Defined entirely through the
         existing custom properties so no other rule needs a mode variant.
         `.classic` is set on <html> from the `bg` query param. */
      .classic {
        --ink: #1c1c22;
        --ink2: rgba(28, 28, 34, 0.62);
        --ink3: rgba(28, 28, 34, 0.46);
        --glass-line: rgba(0, 0, 0, 0.08);
        --glass-hi: rgba(255, 255, 255, 0.5);
      }
      .classic .wrap {
        background: linear-gradient(
          150deg,
          var(--c),
          color-mix(in srgb, var(--c) 80%, #fff)
        );
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.5),
          0 12px 30px rgba(0, 0, 0, 0.28);
      }
      /* Hover fills were white-on-dark; on a light sheet they read as dirt. */
      .classic .ib:hover {
        background: rgba(0, 0, 0, 0.07);
        color: #1c1c22;
      }
      .classic .tool:hover {
        background: rgba(0, 0, 0, 0.06);
      }
      /* The toolbar's top border and the separator between groups were white at
         low alpha, which is invisible on the light sheet. */
      .classic .toolbar {
        border-top-color: rgba(28, 28, 34, 0.14);
      }
      .classic .toolbar .sep {
        background: rgba(28, 28, 34, 0.16);
      }
      .classic .editor {
        scrollbar-color: rgba(28, 28, 34, 0.25) transparent;
      }
      .classic .ib.on {
        background: color-mix(in srgb, var(--c) 48%, #000);
        color: #fff;
      }
      .classic .ib.danger:hover {
        background: rgba(0, 0, 0, 0.09);
        color: #a4322a;
      }
      /* The title underline was a tint of the note colour, which vanishes on a
         sheet of that same colour, and the focus colour was the note colour. */
      .classic .title {
        border-bottom-color: rgba(28, 28, 34, 0.22);
      }
      .classic .title:focus {
        border-bottom-color: rgba(28, 28, 34, 0.45);
      }
      .status .st.failed {
        color: #f7a39a;
      }
      .classic .status .st.failed {
        color: #a4322a;
      }

      /* Custom chrome bar: drag handle plus pin and close, as in the mockup */
      .bar {
        flex: 0 0 auto;
        height: 40px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 8px 0 14px;
        font-size: 12px;
        color: var(--ink2);
        -webkit-app-region: drag;
        cursor: grab;
        user-select: none;
      }
      .bar:active {
        cursor: grabbing;
      }
      .bar .logo {
        flex: none;
        display: block;
      }
      .bar button {
        -webkit-app-region: no-drag;
      }
      .wctl {
        margin-left: auto;
        display: flex;
        gap: 2px;
      }
      .ib {
        width: 30px;
        height: 30px;
        display: grid;
        place-items: center;
        flex: none;
        border: 0;
        border-radius: 8px;
        background: none;
        color: var(--ink2);
        cursor: pointer;
        transition:
          background 0.15s,
          color 0.15s;
      }
      .ib svg {
        width: 15px;
        height: 15px;
      }
      .ib:hover {
        background: rgba(255, 255, 255, 0.08);
        color: var(--ink);
      }
      .ib.on {
        background: color-mix(in srgb, var(--c) 48%, #000);
        color: #fff;
      }
      .ib.danger:hover {
        background: rgba(242, 120, 110, 0.16);
        color: #f7a39a;
      }
      /* Title row with the colour dots replacing the old native colour input */
      .head {
        flex: 0 0 auto;
        position: relative;
        display: flex;
        align-items: flex-end;
        gap: 10px;
        padding: 8px 16px 0;
      }
      .title {
        flex: 1;
        min-width: 0;
        background: transparent;
        border: 0;
        border-bottom: 2px solid color-mix(in srgb, var(--c) 55%, transparent);
        outline: none;
        color: var(--ink);
        font-weight: 600;
        font-size: calc(var(--note-size, 14px) * 1.5);
        line-height: 1.2;
        font-family: var(--title-font, "Geist"), "Segoe UI", sans-serif;
        letter-spacing: -0.015em;
        padding: 0 0 8px;
        transition: border-color 0.15s;
      }
      .title:focus {
        border-color: var(--c);
      }
      .title::placeholder {
        color: var(--ink3);
      }
      /* Both pickers are popovers anchored under the header, so adding ten
         colours costs no permanent width or height. */
      .pop {
        position: absolute;
        top: calc(100% + 4px);
        right: 0;
        z-index: 6;
        padding: 8px;
        border: 1px solid var(--glass-line);
        border-radius: 12px;
        background: rgba(20, 20, 26, 0.96);
        box-shadow: 0 14px 34px rgba(0, 0, 0, 0.4);
      }
      .pop[hidden] {
        display: none;
      }
      .classic .pop {
        background: rgba(255, 255, 255, 0.94);
        border-color: rgba(28, 28, 34, 0.12);
      }
      .dots {
        display: flex;
        gap: 7px;
        align-items: center;
      }
      .colorBtn {
        width: 17px;
        height: 17px;
        flex: none;
        margin-bottom: 9px;
        padding: 0;
        border: 2px solid rgba(255, 255, 255, 0.55);
        border-radius: 50%;
        background: var(--c);
        cursor: pointer;
      }
      /* The trash sits on the title's baseline with the two pickers; without
         this offset its icon rode 3px lower than theirs. */
      #delete {
        margin-bottom: 3px;
      }
      .classic .colorBtn {
        border-color: rgba(28, 28, 34, 0.35);
      }
      .fontbtn {
        margin-bottom: 3px;
        font: 600 13px "Geist", "Segoe UI", sans-serif;
        letter-spacing: -0.02em;
      }
      .fonts {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 168px;
      }
      .fonts button {
        padding: 6px 10px;
        border: 0;
        border-radius: 8px;
        background: none;
        color: var(--ink);
        font-size: 16px;
        text-align: left;
        cursor: pointer;
      }
      .fonts button:hover {
        background: rgba(255, 255, 255, 0.08);
      }
      .fonts button[aria-pressed="true"] {
        background: color-mix(in srgb, var(--c) 30%, transparent);
      }
      .classic .fonts button:hover {
        background: rgba(0, 0, 0, 0.06);
      }
      .dots button {
        width: 15px;
        height: 15px;
        border-radius: 50%;
        border: 2px solid transparent;
        background: var(--k);
        padding: 0;
        cursor: pointer;
        transition: transform 0.15s;
      }
      .dots button:hover {
        transform: scale(1.18);
      }
      .dots button[aria-pressed="true"] {
        border-color: #fff;
      }
      /* The native colour input stays in the DOM but hidden: tests and the
         picker affordance rely on #color, while the visible control is .dots. */
      .color {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
        pointer-events: none;
      }
      .editor {
        flex: 1;
        min-height: 0;
        margin: 12px 16px 6px;
        background: transparent;
        border: 0;
        outline: none;
        /* Was hardcoded #e4e4e8, which is why the classic variant's ink tokens
           never reached the note body. Use the token so the mode decides. */
        color: var(--ink);
        font-size: var(--note-size, 14px);
        line-height: 1.65;
        font-family: "Geist", "Segoe UI", sans-serif;
        overflow: auto;
        white-space: pre-wrap;
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.15) transparent;
      }
      .editor:empty:before {
        content: attr(data-placeholder);
        color: var(--ink3);
      }
      /* Per-selection sizes. Chromium's fontSize command only speaks the seven
         legacy sizes, so these map them onto our px steps. */
      .editor font[size="1"] { font-size: 12px; }
      .editor font[size="2"] { font-size: 14px; }
      .editor font[size="3"] { font-size: 16px; }
      .editor font[size="4"] { font-size: 18px; }
      .editor font[size="5"] { font-size: 20px; }
      .editor font[size="6"] { font-size: 24px; }
      .editor font[size="7"] { font-size: 28px; }
      .editor ul,
      .editor ol {
        margin: 4px 0;
        padding-left: 22px;
      }
      .editor p {
        margin: 0 0 8px;
      }
      /* To-do items: the bullet is replaced by a clickable circle in the list
         gutter. The tick is a real button so it survives the saved innerHTML
         round-trip and keeps its pressed state for assistive technology. */
      .editor li.todo {
        list-style: none;
        position: relative;
      }
      .editor li.todo > .tick {
        position: absolute;
        left: -22px;
        top: 0.32em;
        width: 15px;
        height: 15px;
        padding: 0;
        margin: 0;
        border: 1.5px solid currentColor;
        border-radius: 50%;
        background: none;
        color: inherit;
        opacity: 0.55;
        cursor: pointer;
        appearance: none;
        font: inherit;
      }
      .editor li.todo > .tick:hover,
      .editor li.todo > .tick:focus-visible {
        opacity: 1;
      }
      .editor li.todo[data-done="true"] > .tick {
        background: var(--c);
        border-color: var(--c);
        color: #1c1c22;
        opacity: 1;
      }
      .editor li.todo[data-done="true"] > .tick::after {
        content: "";
        position: absolute;
        left: 4px;
        top: 1px;
        width: 5px;
        height: 8px;
        border: solid currentColor;
        border-width: 0 1.5px 1.5px 0;
        transform: rotate(45deg);
      }
      .editor li.todo[data-done="true"] {
        color: var(--ink3);
        text-decoration: line-through;
      }
      /* Zero-width inline anchor between the absolutely positioned tick and the
         text. Without it Chromium paints a caret at text offset 0 on the tick
         itself, so the caret appears inside the circle. */
      .editor li.todo > .tick-space {
        display: inline-block;
        width: 0;
        height: 1em;
        padding: 0;
        margin: 0;
      }
      .toolbar {
        flex: 0 0 auto;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 3px;
        padding: 8px 12px;
        border-top: 1px solid rgba(255, 255, 255, 0.07);
      }
      .tool {
        flex: 0 0 auto;
        width: 30px;
        height: 30px;
        display: grid;
        place-items: center;
        border: 0;
        border-radius: 8px;
        background: none;
        color: var(--ink2);
        font-size: 13.5px;
        cursor: pointer;
        transition:
          background 0.15s,
          color 0.15s;
      }
      .tool svg {
        width: 16px;
        height: 16px;
        display: block;
        stroke: currentColor;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .tool b,
      .tool i,
      .tool u,
      .tool s {
        font: 600 13.5px "Geist", "Segoe UI", sans-serif;
      }
      .tool:hover {
        background: rgba(255, 255, 255, 0.08);
        color: var(--ink);
      }
      /* Active formatting command reflects the caret's current state.
         The glyph is --ink, never the note colour: in classic mode the window
         is a sheet of that same colour, so a --c glyph on it was invisible. The
         tinted chip behind it still marks the command as active. */
      .tool.active {
        background: color-mix(in srgb, var(--c) 24%, transparent);
        color: var(--ink);
      }
      .toolbar .sep {
        width: 1px;
        height: 16px;
        background: rgba(255, 255, 255, 0.1);
        margin: 0 4px;
      }
      .status {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 0 16px 12px;
        font-size: 11.5px;
        color: var(--ink3);
      }
      .status .words {
        flex: 0 0 auto;
      }
      @media (prefers-reduced-motion: reduce) {
        .dots button,
        .tool,
        .ib,
        .title {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <div class="bar">
        <svg class="logo" width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
          <rect x="2" y="2" width="10" height="2.4" rx="1.2" fill="#F2A38F" />
          <rect x="2" y="5.8" width="7" height="2.4" rx="1.2" fill="#8EC5E8" />
          <rect x="2" y="9.6" width="9" height="2.4" rx="1.2" fill="#9CCFA5" />
        </svg>
        <span id="windowTitle">Tabbin Notes</span>
        <div class="wctl">
          <button id="newNote" class="ib" title="New note" aria-label="New note" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <path d="M12 5v14M5 12h14" />
            </svg>
          </button>
          <button
            id="pinNote"
            class="ib"
            title="Always on top: off"
            type="button"
            aria-pressed="false"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 17v5M9 3h6l-1 6 3 3H7l3-3z" />
            </svg>
          </button>
          <button id="fullscreen" class="ib" title="Full screen" aria-label="Full screen" aria-pressed="false" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 9V4h5M20 15v5h-5M15 4h5v5M9 20H4v-5" />
            </svg>
          </button>
          <button id="closeWin" class="ib danger" title="Close note" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M6 6l12 12M18 6 6 18" />
            </svg>
          </button>
        </div>
      </div>
      <div class="head">
        <input id="title" class="title" placeholder="Untitled note" aria-label="Note title" />
        <input id="color" class="color" type="color" title="Change note color" />
        <button id="fontBtn" class="ib fontbtn" title="Text font" aria-label="Text font" aria-expanded="false" type="button">Aa</button>
        <button id="colorBtn" class="colorBtn" title="Note colour" aria-label="Note colour" aria-expanded="false" type="button"></button>
        <div class="pop dots" id="dots" role="group" aria-label="Note colour" hidden></div>
        <div class="pop fonts" id="fonts" role="group" aria-label="Text font" hidden></div>
        <button id="delete" class="ib danger" title="Delete note" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3" />
          </svg>
        </button>
      </div>
      <div id="editor" class="editor" contenteditable="true" data-placeholder="Write a note…"></div>
      <div class="toolbar" aria-label="Text formatting">
        <button class="tool" data-size="-1" title="Decrease text size" aria-label="Decrease text size">A−</button
        ><button class="tool" data-size="1" title="Increase text size" aria-label="Increase text size">A+</button
        ><span class="sep"></span
        ><button class="tool" title="Bold" data-cmd="bold"><b>B</b></button
        ><button class="tool" title="Italic" data-cmd="italic"><i>I</i></button
        ><button class="tool" title="Underline" data-cmd="underline"><u>U</u></button
        ><button class="tool" title="Strikethrough" data-cmd="strikeThrough"><svg viewBox="0 0 24 24"><path d="M16 4H9a3 3 0 0 0-2.83 4"/><path d="M14 12a4 4 0 0 1 0 8H6"/><line x1="4" x2="20" y1="12" y2="12"/></svg></button
        ><span class="sep"></span
        ><button class="tool" title="Bulleted list" data-cmd="insertUnorderedList"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r=".6" fill="currentColor"/><circle cx="4.5" cy="12" r=".6" fill="currentColor"/><circle cx="4.5" cy="18" r=".6" fill="currentColor"/></svg></button
        ><button class="tool" title="Numbered list" data-cmd="insertOrderedList"><svg viewBox="0 0 24 24"><path d="M10 6h10M10 12h10M10 18h10M4 5l1.5-1v4M4 14h3l-3 3h3"/></svg></button
        ><button class="tool" id="todoBtn" title="To-do list" aria-label="To-do list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="4.5" cy="6" r="2.5"/><path d="m3.4 6 1 .9 1.7-1.8"/><circle cx="4.5" cy="18" r="2.5"/><path d="M10 6h10M10 18h10"/></svg></button
        ><span class="sep"></span
        ><button class="tool" title="Outdent" data-cmd="outdent"><svg viewBox="0 0 24 24"><path d="M20 6H10M20 12h-6M20 18H10M7 9l-3 3 3 3"/></svg></button
        ><button class="tool" title="Indent" data-cmd="indent"><svg viewBox="0 0 24 24"><path d="M20 6H10M20 12h-6M20 18H10M4 9l3 3-3 3"/></svg></button
        ><span class="sep"></span
        ><button class="tool" title="Align left" data-cmd="justifyLeft"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h14"/></svg></button
        ><button class="tool" title="Align center" data-cmd="justifyCenter"><svg viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M5 18h14"/></svg></button
        ><button class="tool" title="Align right" data-cmd="justifyRight"><svg viewBox="0 0 24 24"><path d="M4 6h16M10 12h10M6 18h14"/></svg></button
        ><button class="tool" title="Paragraph" data-cmd="formatBlock" data-value="p">¶</button>
      </div>
      <div class="status">
        <span class="st" id="saveState">Saved.</span>
        <span class="words" id="wordCount"></span>
      </div>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      // Follow the dock's appearance. The main process migrates any pre-2.2
      // name before sending it, so anything that is not 'glass' is classic —
      // the window must never be left without a variant.
      document.documentElement.classList.toggle('classic', params.get('bg') !== 'glass');
      const id = params.get('id');
      // The main process owns the palette so the dots and the colours it
      // assigns to new notes can never drift apart.
      const palette = (params.get('palette') || '#F2A38F,#9CCFA5,#8EC5E8,#F0D58A,#B9A7E8')
        .split(',')
        .map((c) => c.trim())
        .filter(Boolean);
      // Same list as noteFonts in main.js, passed in so the menu and the
      // allowlist can never drift apart.
      const fonts = (params.get('fonts') || 'Geist|Inter|Public Sans|Gelasio|Parisienne')
        .split('|')
        .map((f) => f.trim())
        .filter(Boolean);

            paragraph.appendChild(document.createElement('br'));
            list.replaceWith(paragraph);
            caretAfterTick(paragraph);
          } else {
            caretAfterTick(previous || list.querySelector('li'));
          }
        } else {
          setTodo(li, false);
        }
        markEdited();
        save();
        syncTools();
      });
      // Keyboard path for checking an item without reaching for the mouse.
      editor.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter' || !(e.ctrlKey || e.metaKey)) return;
        const li = currentLi() && currentLi().closest('li.todo');
        if (!li) return;
        e.preventDefault();
        toggleDone(li);
      });
      // Enter on a to-do clones the tick into the next item but leaves the caret
      // before it, which renders the caret on top of the circle. Wait for the
      // split, then put the caret in the new item's text.
      editor.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter' || e.ctrlKey || e.metaKey || e.altKey || e.shiftKey) return;
        const li = currentLi();
        if (!li || !li.classList.contains('todo')) return;
        setTimeout(() => {
          normalizeTodos();
          const current = currentLi();
          if (!current || !current.classList.contains('todo')) return;
          const sel = window.getSelection();
          if (!sel || !sel.rangeCount) return;
          const node = sel.getRangeAt(0).startContainer;
          const inText = node.nodeType === Node.TEXT_NODE && node.parentElement.closest('li') === current;
          if (!inText) caretAfterTick(current);
        }, 0);
      });
      // Automatic lists: typing "1. ", "- " or "[] " at the start of a block
      // turns it into a list. execCommand adds its own marker but leaves the
      // typed text, so remove the trigger first or the line shows "1. 1." or
      // two bullets.
      editor.addEventListener('input', () => {
        const sel = window.getSelection();
        if (!sel || !sel.anchorNode || !sel.isCollapsed) return;
        const node = sel.anchorNode;
        if (node.nodeType !== Node.TEXT_NODE || sel.anchorOffset !== node.textContent.length) return;
        const text = node.textContent || '';
        const trigger = /^(1\. |- |\[\] )$/.exec(text);
        if (!trigger) return;
        const block = node.parentElement;
        if (!block || block.closest('ul,ol,li')) return;
        const range = document.createRange();
        range.setStart(node, text.length - trigger[0].length);
        range.setEnd(node, text.length);
        range.deleteContents();
        range.collapse(true);
        sel.removeAllRanges();
        sel.addRange(range);
        document.execCommand(trigger[0] === '1. ' ? 'insertOrderedList' : 'insertUnorderedList', false, null);
        if (trigger[0] === '[] ') {
          const li = currentLi();
          setTodo(li, true);
          caretAfterTick(li);
        }
        markEdited();
        syncTools();
      });
      editor.addEventListener('keyup', syncTools);
      editor.addEventListener('mouseup', syncTools);
      document.querySelector('#newNote').onclick = () => window.tabbin.create();
      pinNote.onclick = async () => {
        const n = await window.tabbin.toggleNoteAlwaysOnTop(id);
        if (n) apply(n);
      };
      function paintFullscreen(on) {
        fullScreen = !!on;
        fullscreenBtn.classList.toggle('on', fullScreen);
        fullscreenBtn.setAttribute('aria-pressed', String(fullScreen));
        fullscreenBtn.title = fullScreen ? 'Exit full screen' : 'Full screen';
      }
      fullscreenBtn.onclick = async () =>
        paintFullscreen(await window.tabbin.toggleNoteFullscreen(id));
      window.tabbin.onNoteFullscreen(paintFullscreen);
      closeWin.onclick = () => window.close();
      title.oninput = () => save();
      editor.oninput = () => save();
      // Flush a pending debounced save when the window stops being the active
      // one. The 450ms timer lives in this renderer, so typing and then
      // alt-tabbing away could otherwise drop the last edit. This does not cover
      // the close button: closing a window fires no blur, so that path is left
      // to the noteGone guard above rather than a racy teardown-time save.
      const flushPending = () => {
        if (timer && !noteGone) {
          clearTimeout(timer);
          save(true);
        }
      };
      window.addEventListener('blur', flushPending);
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden') flushPending();
      });
      color.oninput = () => save(true);
      color.onchange = () => save(true);
      document.querySelector('#delete').onclick = () => {
        if (confirm('Delete this note?')) window.tabbin.remove(id);
      };
      window.tabbin.onChanged((notes) => {
        if (!notes.some((x) => x.id === id)) {
          noteGone = true;
          clearTimeout(timer);
          timer = null;
          return;
        }
        const n = notes.find((x) => x.id === id);
        // Don't clobber the field the user is currently typing in.
        if (
          n &&
          document.activeElement !== title &&
          document.activeElement !== editor &&
          document.activeElement !== color &&
          document.activeElement !== pinNote
        )
          apply(n);
      });
      window.tabbin.get(id).then((n) => {
        if (n) apply(n);
        editor.focus();
      });
    </script>
  </body>
</html>

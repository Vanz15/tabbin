<!doctype html><html><head><meta charset="UTF-8"><title>Tabbin Note</title><style>*{box-sizing:border-box}html,body{margin:0;background:transparent!important;color:#1b1d27;font-family:Inter,Segoe UI,sans-serif;overflow:hidden}body{background:var(--note-color,#f5c542)!important}body::-webkit-scrollbar,.wrap::-webkit-scrollbar,.editor::-webkit-scrollbar{width:0;height:0}.wrap{padding:20px;height:100vh;display:flex;flex-direction:column;gap:8px}.bar{display:flex;gap:10px;align-items:center}.title{flex:1;background:transparent;border:0;border-bottom:2px solid #0003;color:#161822;font:700 20px Inter,Segoe UI,sans-serif;padding:7px 2px;outline:none}.color{width:26px;height:26px;padding:0;border:0;border-radius:50%;background:transparent;cursor:pointer;overflow:hidden}.color::-webkit-color-swatch-wrapper{padding:0}.color::-webkit-color-swatch{border:2px solid #0005;border-radius:50%}.delete{border:0;background:#0002;color:#161822;border-radius:8px;width:32px;height:32px;font-size:18px;line-height:1;cursor:pointer}.editor{flex:1;min-height:0;background:transparent;border:0;color:#161822;padding:8px 2px;font:16px/1.6 Inter,Segoe UI,sans-serif;outline:none;overflow:auto;white-space:pre-wrap}.editor:empty:before{content:attr(data-placeholder);color:#0007}.editor ul,.editor ol{padding-left:28px}.editor p{margin:0 0 8px}.toolbar{display:flex;flex-wrap:nowrap;gap:3px;align-items:center;padding:4px 0;border-top:1px solid #0002;overflow:hidden}.tool{border:0;background:#0001;color:#161822;border-radius:5px;width:27px;height:25px;padding:3px;flex:0 0 27px;cursor:pointer}.tool svg{width:18px;height:18px;display:block;margin:auto;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.tool b,.tool i,.tool u{font:600 13px Inter,Segoe UI,sans-serif}.tool:hover,.tool.active{background:#0003}.pin-tool{font-size:15px}.status{font-size:11px;color:#0008}.tip{font-size:11px;color:#0007;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}</style></head><body><main class="wrap"><div class="bar"><input id="title" class="title"><input id="color" class="color" type="color" title="Change note color"><button id="delete" class="delete" title="Delete note">🗑</button></div><div id="editor" class="editor" contenteditable="true" data-placeholder="Write a note…"></div><div class="toolbar" aria-label="Text formatting"><button class="tool" title="Bold" data-cmd="bold"><b>B</b></button><button class="tool" title="Italic" data-cmd="italic"><i>I</i></button><button class="tool" title="Underline" data-cmd="underline"><u>U</u></button><button class="tool" title="Strikethrough" data-cmd="strikeThrough"><svg viewBox="0 0 24 24"><path d="M16 4H9a3 3 0 0 0-2.83 4"/><path d="M14 12a4 4 0 0 1 0 8H6"/><line x1="4" x2="20" y1="12" y2="12"/></svg></button><button class="tool" title="Bulleted list" data-cmd="insertUnorderedList"><svg viewBox="0 0 24 24"><circle cx="4" cy="5" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="19" r="1"/><path d="M8 5h13M8 12h13M8 19h13"/></svg></button><button class="tool" title="Numbered list" data-cmd="insertOrderedList"><svg viewBox="0 0 24 24"><path d="M4 4v6M2 4h2M2 10h4M2 14h2a2 2 0 1 1-2 2h4M2 20h4M2 17h2a2 2 0 1 0-2-2"/><path d="M9 5h12M9 12h12M9 19h12"/></svg></button><button class="tool" title="Indent" data-cmd="indent">⇥</button><button class="tool" title="Outdent" data-cmd="outdent">⇤</button><button class="tool" title="Align left" data-cmd="justifyLeft"><svg viewBox="0 0 24 24"><path d="M21 5H3M15 12H3M17 19H3"/></svg></button><button class="tool" title="Align center" data-cmd="justifyCenter"><svg viewBox="0 0 24 24"><path d="M21 5H3M17 12H7M19 19H5"/></svg></button><button class="tool" title="Align right" data-cmd="justifyRight"><svg viewBox="0 0 24 24"><path d="M21 5H3M21 12H9M21 19H7"/></svg></button><button class="tool" title="Paragraph" data-cmd="formatBlock" data-value="p">¶</button><button id="pinNote" class="tool pin-tool" title="Always on top: off" type="button">📌</button></div><div class="status">Changes are saved automatically. <span id="saveState">Saved</span></div></main><script>const id=new URLSearchParams(location.search).get('id'),pinNote=document.querySelector('#pinNote'),title=document.querySelector('#title'),editor=document.querySelector('#editor'),color=document.querySelector('#color'),saveState=document.querySelector('#saveState'),body=document.body;let timer;function apply(n){const c=n.color||'#f5c542';body.style.setProperty('--note-color',c);color.value=c;title.value=n.title||'';editor.innerHTML=n.content||'';pinNote.classList.toggle('active',!!n.alwaysOnTop);pinNote.title=n.alwaysOnTop?'Always on top: on':'Always on top: off'}window.tabbin.get(id).then(n=>{if(n)apply(n)});function payload(){return{id,title:title.value,content:editor.innerHTML,color:color.value,alwaysOnTop:pinNote.classList.contains('active')}}function save(immediate=false){saveState.textContent='Saving…';clearTimeout(timer);const write=async()=>{await window.tabbin.update(payload());body.style.setProperty('--note-color',color.value);saveState.textContent='Saved'};if(immediate)write();else timer=setTimeout(write,450)}function command(btn){editor.focus();document.execCommand(btn.dataset.cmd,false,btn.dataset.value||null);save()}document.querySelectorAll('.tool').forEach(btn=>{if(btn.id!=='pinNote')btn.onmousedown=e=>{e.preventDefault();command(btn)}});pinNote.onclick=async()=>{const n=await window.tabbin.toggleNoteAlwaysOnTop(id);if(n)apply(n)};title.oninput=save;editor.oninput=save;color.oninput=()=>save(true);color.onchange=()=>save(true);document.querySelector('#delete').onclick=()=>{if(confirm('Delete this note?'))window.tabbin.remove(id)};window.tabbin.onChanged(notes=>{const n=notes.find(x=>x.id===id);if(n&&document.activeElement!==title&&document.activeElement!==editor&&document.activeElement!==color&&document.activeElement!==pinNote)apply(n)});</script></body></html>

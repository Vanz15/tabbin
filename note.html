<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Tabbin Note</title>
    <style>
      /* Frosted-glass note window, ported from the design mockup's `.win`.
         The window is frameless and translucent, so this page paints the whole
         surface: the OS acrylic supplies the blur, these tokens the tint. */
      :root {
        --glass: rgba(24, 24, 27, 0.72);
        --glass-line: rgba(255, 255, 255, 0.09);
        --glass-hi: rgba(255, 255, 255, 0.06);
        --ink: #f4f4f5;
        --ink2: #b4b4bc;
        --ink3: #76767e;
        --danger: #f2786e;
        --c: #8ec5e8;
        font-family:
          Inter,
          "Segoe UI",
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        /* Transparent so the acrylic behind the window shows through. */
        background: transparent !important;
        color: var(--ink);
        overflow: hidden;
        font-family:
          Inter,
          "Segoe UI",
          sans-serif;
      }
      body::-webkit-scrollbar,
      .wrap::-webkit-scrollbar,
      .editor::-webkit-scrollbar {
        width: 0;
        height: 0;
      }
      .wrap {
        height: 100vh;
        display: flex;
        flex-direction: column;
        /* The window is now fully transparent (transparent:true + alpha 0), so the
           CSS here paints the entire visible surface — this is what lets the
           clip-path cut genuine rounded corners against the desktop and makes the
           colour spine reach the edge. An opaque gradient base fills the surface
           so Chromium never leaves an uninitialised white region to ghost. */
        clip-path: inset(0 round 16px);
        background: linear-gradient(
            180deg,
            color-mix(in srgb, var(--c) 17%, transparent),
            transparent 42%
          ),
          #18181b;
        border: 1px solid var(--glass-line);
        box-shadow:
          inset 0 1px 0 var(--glass-hi),
          0 24px 60px rgba(0, 0, 0, 0.45),
          0 2px 8px rgba(0, 0, 0, 0.3);
        overflow: hidden;
      }
      /* Classic mode: the note window is a solid sheet of the note colour with
         dark ink, matching the classic dock tiles. Defined entirely through the
         existing custom properties so no other rule needs a mode variant.
         `.classic` is set on <html> from the `bg` query param. */
      .classic {
        --ink: #1c1c22;
        --ink2: rgba(28, 28, 34, 0.62);
        --ink3: rgba(28, 28, 34, 0.46);
        --glass-line: rgba(0, 0, 0, 0.08);
        --glass-hi: rgba(255, 255, 255, 0.5);
      }
      .classic .wrap {
        background: linear-gradient(
          150deg,
          var(--c),
          color-mix(in srgb, var(--c) 80%, #fff)
        );
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.5),
          0 12px 30px rgba(0, 0, 0, 0.28);
      }
      /* Hover fills were white-on-dark; on a light sheet they read as dirt. */
      .classic .ib:hover {
        background: rgba(0, 0, 0, 0.07);
        color: #1c1c22;
      }
      .classic .ib.on {
        color: #1c1c22;
      }
      .classic .ib.danger:hover {
        background: rgba(0, 0, 0, 0.09);
        color: #a4322a;
      }
      /* The title underline was a tint of the note colour, which vanishes on a
         sheet of that same colour, and the focus colour was the note colour. */
      .classic .title {
        border-bottom-color: rgba(28, 28, 34, 0.22);
      }
      .classic .title:focus {
        border-bottom-color: rgba(28, 28, 34, 0.45);
      }
      /* Save-status dot is a white ring on dark; needs a dark ring on light. */
      .classic .status .st::before {
        box-shadow: 0 0 0 1px rgba(28, 28, 34, 0.18);
      }

      /* Custom chrome bar: drag handle plus pin and close, as in the mockup */
      .bar {
        flex: 0 0 auto;
        height: 40px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 8px 0 14px;
        font-size: 12px;
        color: var(--ink2);
        -webkit-app-region: drag;
        cursor: grab;
        user-select: none;
      }
      .bar:active {
        cursor: grabbing;
      }
      .bar .logo {
        flex: none;
        display: block;
      }
      .bar button {
        -webkit-app-region: no-drag;
      }
      .wctl {
        margin-left: auto;
        display: flex;
        gap: 2px;
      }
      .ib {
        width: 30px;
        height: 30px;
        display: grid;
        place-items: center;
        flex: none;
        border: 0;
        border-radius: 8px;
        background: none;
        color: var(--ink2);
        cursor: pointer;
        transition:
          background 0.15s,
          color 0.15s;
      }
      .ib svg {
        width: 15px;
        height: 15px;
      }
      .ib:hover {
        background: rgba(255, 255, 255, 0.08);
        color: var(--ink);
      }
      .ib.on {
        color: #8ec5e8;
      }
      .ib.danger:hover {
        background: rgba(242, 120, 110, 0.16);
        color: #f7a39a;
      }
      /* Title row with the colour dots replacing the old native colour input */
      .head {
        flex: 0 0 auto;
        display: flex;
        align-items: flex-end;
        gap: 10px;
        padding: 8px 16px 0;
      }
      .title {
        flex: 1;
        min-width: 0;
        background: transparent;
        border: 0;
        border-bottom: 2px solid color-mix(in srgb, var(--c) 55%, transparent);
        outline: none;
        color: var(--ink);
        font: 600 21px Inter, "Segoe UI", sans-serif;
        letter-spacing: -0.015em;
        padding: 0 0 8px;
        transition: border-color 0.15s;
      }
      .title:focus {
        border-color: var(--c);
      }
      .title::placeholder {
        color: var(--ink3);
      }
      .dots {
        display: flex;
        gap: 7px;
        align-items: center;
        padding-bottom: 11px;
      }
      .dots button {
        width: 15px;
        height: 15px;
        border-radius: 50%;
        border: 2px solid transparent;
        background: var(--k);
        padding: 0;
        cursor: pointer;
        transition: transform 0.15s;
      }
      .dots button:hover {
        transform: scale(1.18);
      }
      .dots button[aria-pressed="true"] {
        border-color: #fff;
      }
      /* The native colour input stays in the DOM but hidden: tests and the
         picker affordance rely on #color, while the visible control is .dots. */
      .color {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
        pointer-events: none;
      }
      .editor {
        flex: 1;
        min-height: 0;
        margin: 12px 16px 6px;
        background: transparent;
        border: 0;
        outline: none;
        /* Was hardcoded #e4e4e8, which is why the classic variant's ink tokens
           never reached the note body. Use the token so the mode decides. */
        color: var(--ink);
        font: 14px/1.65 Inter, "Segoe UI", sans-serif;
        overflow: auto;
        white-space: pre-wrap;
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.15) transparent;
      }
      .editor:empty:before {
        content: attr(data-placeholder);
        color: var(--ink3);
      }
      .editor ul,
      .editor ol {
        margin: 4px 0;
        padding-left: 22px;
      }
      .editor p {
        margin: 0 0 8px;
      }
      .toolbar {
        flex: 0 0 auto;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 3px;
        padding: 8px 12px;
        border-top: 1px solid rgba(255, 255, 255, 0.07);
      }
      .tool {
        flex: 0 0 auto;
        width: 30px;
        height: 30px;
        display: grid;
        place-items: center;
        border: 0;
        border-radius: 8px;
        background: none;
        color: var(--ink2);
        font-size: 13.5px;
        cursor: pointer;
        transition:
          background 0.15s,
          color 0.15s;
      }
      .tool svg {
        width: 16px;
        height: 16px;
        display: block;
        stroke: currentColor;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .tool b,
      .tool i,
      .tool u,
      .tool s {
        font: 600 13.5px Inter, "Segoe UI", sans-serif;
      }
      .tool:hover {
        background: rgba(255, 255, 255, 0.08);
        color: var(--ink);
      }
      /* Active formatting command reflects the caret's current state */
      .tool.active {
        background: color-mix(in srgb, var(--c) 24%, transparent);
        color: var(--c);
      }
      .toolbar .sep {
        width: 1px;
        height: 16px;
        background: rgba(255, 255, 255, 0.1);
        margin: 0 4px;
      }
      .status {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 0 16px 12px;
        font-size: 11.5px;
        color: var(--ink3);
      }
      .status .st::before {
        content: "";
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #9ccfa5;
        margin-right: 7px;
        vertical-align: 1px;
        transition: background 0.2s;
      }
      .status .st.busy::before {
        background: #f0d58a;
      }
      .status .words {
        flex: 0 0 auto;
      }
      @media (prefers-reduced-motion: reduce) {
        .dots button,
        .tool,
        .ib,
        .title {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <div class="bar">
        <svg class="logo" width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
          <rect x="2" y="2" width="10" height="2.4" rx="1.2" fill="#F2A38F" />
          <rect x="2" y="5.8" width="7" height="2.4" rx="1.2" fill="#8EC5E8" />
          <rect x="2" y="9.6" width="9" height="2.4" rx="1.2" fill="#9CCFA5" />
        </svg>
        <span>Tabbin Note</span>
        <div class="wctl">
          <button
            id="pinNote"
            class="ib"
            title="Always on top: off"
            type="button"
            aria-pressed="false"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 17v5M9 3h6l-1 6 3 3H7l3-3z" />
            </svg>
          </button>
          <button id="closeWin" class="ib danger" title="Close note" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M6 6l12 12M18 6 6 18" />
            </svg>
          </button>
        </div>
      </div>
      <div class="head">
        <input id="title" class="title" placeholder="Untitled note" aria-label="Note title" />
        <input id="color" class="color" type="color" title="Change note color" />
        <div class="dots" id="dots" role="group" aria-label="Note colour"></div>
        <button id="delete" class="ib danger" title="Delete note" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3" />
          </svg>
        </button>
      </div>
      <div id="editor" class="editor" contenteditable="true" data-placeholder="Write a note…"></div>
      <div class="toolbar" aria-label="Text formatting">
        <button class="tool" title="Bold" data-cmd="bold"><b>B</b></button
        ><button class="tool" title="Italic" data-cmd="italic"><i>I</i></button
        ><button class="tool" title="Underline" data-cmd="underline"><u>U</u></button
        ><button class="tool" title="Strikethrough" data-cmd="strikeThrough"><svg viewBox="0 0 24 24"><path d="M16 4H9a3 3 0 0 0-2.83 4"/><path d="M14 12a4 4 0 0 1 0 8H6"/><line x1="4" x2="20" y1="12" y2="12"/></svg></button
        ><span class="sep"></span
        ><button class="tool" title="Bulleted list" data-cmd="insertUnorderedList"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r=".6" fill="currentColor"/><circle cx="4.5" cy="12" r=".6" fill="currentColor"/><circle cx="4.5" cy="18" r=".6" fill="currentColor"/></svg></button
        ><button class="tool" title="Numbered list" data-cmd="insertOrderedList"><svg viewBox="0 0 24 24"><path d="M10 6h10M10 12h10M10 18h10M4 5l1.5-1v4M4 14h3l-3 3h3"/></svg></button
        ><span class="sep"></span
        ><button class="tool" title="Outdent" data-cmd="outdent"><svg viewBox="0 0 24 24"><path d="M20 6H10M20 12h-6M20 18H10M7 9l-3 3 3 3"/></svg></button
        ><button class="tool" title="Indent" data-cmd="indent"><svg viewBox="0 0 24 24"><path d="M20 6H10M20 12h-6M20 18H10M4 9l3 3-3 3"/></svg></button
        ><span class="sep"></span
        ><button class="tool" title="Align left" data-cmd="justifyLeft"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h14"/></svg></button
        ><button class="tool" title="Align center" data-cmd="justifyCenter"><svg viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M5 18h14"/></svg></button
        ><button class="tool" title="Align right" data-cmd="justifyRight"><svg viewBox="0 0 24 24"><path d="M4 6h16M10 12h10M6 18h14"/></svg></button
        ><button class="tool" title="Paragraph" data-cmd="formatBlock" data-value="p">¶</button>
      </div>
      <div class="status">
        <span class="st" id="saveState">Saved automatically</span>
        <span class="words" id="wordCount"></span>
      </div>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      // Follow the dock's appearance. The main process migrates any pre-2.2
      // name before sending it, so anything that is not 'glass' is classic —
      // the window must never be left without a variant.
      document.documentElement.classList.toggle('classic', params.get('bg') !== 'glass');
      const id = params.get('id');
      // The main process owns the palette so the dots and the colours it
      // assigns to new notes can never drift apart.
      const palette = (params.get('palette') || '#F2A38F,#9CCFA5,#8EC5E8,#F0D58A,#B9A7E8')
        .split(',')
        .map((c) => c.trim())
        .filter(Boolean);
      const pinNote = document.querySelector('#pinNote'),
        closeWin = document.querySelector('#closeWin'),
        title = document.querySelector('#title'),
        editor = document.querySelector('#editor'),
        color = document.querySelector('#color'),
        dots = document.querySelector('#dots'),
        saveState = document.querySelector('#saveState'),
        wordCount = document.querySelector('#wordCount'),
        body = document.body;
      let timer;
      let wordTimer;
      // Writing this window's own state back into the contenteditable tears the
      // caret down and rebuilds the text, so a repaint still in flight from the
      // keystroke gets composited against a surface that no longer exists — the
      // ghosting that lingered after a delete. Track what is already rendered
      // and only touch the DOM when the incoming value actually differs.
      let renderedContent = null;
      let renderedTitle = null;
      function apply(n) {
        const c = n.color || palette[0];
        body.style.setProperty('--c', c);
        color.value = c;
        const nextTitle = n.title || '';
        if (nextTitle !== renderedTitle) {
          title.value = nextTitle;
          renderedTitle = nextTitle;
        }
        const nextContent = n.content || '';
        if (nextContent !== renderedContent) {
          editor.innerHTML = nextContent;
          renderedContent = nextContent;
        }
        pinNote.classList.toggle('on', !!n.alwaysOnTop);
        pinNote.setAttribute('aria-pressed', !!n.alwaysOnTop);
        // The test suite asserts on this exact wording.
        pinNote.title = n.alwaysOnTop ? 'Always on top: on' : 'Always on top: off';
        drawDots(c);
        scheduleWordCount();
      }
      function drawDots(current) {
        dots.innerHTML = palette
          .map(
            (c) =>
              `<button style="--k:${c}" data-c="${c}" title="${c}" aria-label="Use colour ${c}" aria-pressed="${c.toLowerCase() === String(current).toLowerCase()}"></button>`,
          )
          .join('');
      }
      dots.onclick = (e) => {
        const button = e.target.closest('button[data-c]');
        if (!button) return;
        const next = button.dataset.c;
        body.style.setProperty('--c', next);
        color.value = next;
        drawDots(next);
        save(true);
      };
      // Reading editor.innerText forces a synchronous layout flush. Doing that on
      // every keystroke stalls the frame, and any repaint still in flight when
      // the save round-trip lands becomes visible as ghosting. Debounce it so
      // the read happens once typing has settled.
      function scheduleWordCount() {
        clearTimeout(wordTimer);
        wordTimer = setTimeout(countWords, 250);
      }
      function countWords() {
        const words = (editor.innerText || '').trim().split(/\s+/).filter(Boolean).length;
        wordCount.textContent = words + (words === 1 ? ' word' : ' words');
      }
      function payload() {
        return {
          id,
          title: title.value,
          content: editor.innerHTML,
          color: color.value,
          alwaysOnTop: pinNote.classList.contains('on'),
        };
      }
      // Keep the tracked content in step with what this window has actually
      // rendered, so the saved echo is recognised as our own and skipped.
      function markEdited() {
        renderedTitle = title.value;
        renderedContent = editor.innerHTML;
      }
      function save(immediate = false) {
        saveState.textContent = 'Saving…';
        saveState.classList.add('busy');
        scheduleWordCount();
        clearTimeout(timer);
        const write = async () => {
          markEdited();
          await window.tabbin.update(payload());
          saveState.textContent = 'Saved automatically';
          saveState.classList.remove('busy');
        };
        if (immediate) write();
        else timer = setTimeout(write, 450);
      }
      function command(button) {
        editor.focus();
        document.execCommand(button.dataset.cmd, false, button.dataset.value || null);
        syncTools();
        save();
      }
      // Reflect the caret's active formatting so the current command lights up,
      // as in the mockup.
      function syncTools() {
        document.querySelectorAll('.tool[data-cmd]').forEach((button) => {
          let on = false;
          try {
            on = document.queryCommandState(button.dataset.cmd);
          } catch {
            on = false;
          }
          button.classList.toggle('active', !!on);
        });
      }
      document.querySelectorAll('.tool').forEach((button) => {
        button.onmousedown = (e) => {
          e.preventDefault();
          command(button);
        };
      });
      editor.addEventListener('keyup', syncTools);
      editor.addEventListener('mouseup', syncTools);
      pinNote.onclick = async () => {
        const n = await window.tabbin.toggleNoteAlwaysOnTop(id);
        if (n) apply(n);
      };
      closeWin.onclick = () => window.close();
      title.oninput = () => save();
      editor.oninput = () => save();
      color.oninput = () => save(true);
      color.onchange = () => save(true);
      document.querySelector('#delete').onclick = () => {
        if (confirm('Delete this note?')) window.tabbin.remove(id);
      };
      window.tabbin.onChanged((notes) => {
        const n = notes.find((x) => x.id === id);
        // Don't clobber the field the user is currently typing in.
        if (
          n &&
          document.activeElement !== title &&
          document.activeElement !== editor &&
          document.activeElement !== color &&
          document.activeElement !== pinNote
        )
          apply(n);
      });
      window.tabbin.get(id).then((n) => {
        if (n) apply(n);
        editor.focus();
      });
    </script>
  </body>
</html>

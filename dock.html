<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Tabbin</title>
    <style>
      /* Geist, bundled rather than hotlinked: an Electron app that reaches a
         font CDN on every launch stalls on a slow link and shows a fallback
         face when offline. Geist ships as a variable font, so one 29 KB file
         covers 400/500/600 through the weight axis. */
      @font-face {
        font-family: "Geist";
        src: url("fonts/Geist-Variable.woff2") format("woff2-variations");
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }
      /* Frosted-glass tokens, ported from the design mockup and mirrored
         for a left-docked panel. The alpha is deliberately much higher than the
         mockup's .74: the mockup had `backdrop-filter: blur(22px)` behind that
         tint, which a frameless transparent Electron overlay has nothing to
         sample. Without that blur, .74 left the dock unreadable over a busy
         desktop — text from the window behind showed straight through. This
         value keeps the frosted tint and border while making the surface
         effectively opaque to whatever is behind it. */
      :root {
        --glass: rgba(20, 20, 23, 0.96);
        --glass-line: rgba(255, 255, 255, 0.09);
        --glass-hi: rgba(255, 255, 255, 0.08);
        --ink: #f4f4f5;
        --ink2: #b4b4bc;
        --ink3: #8b8b93;
        --accent: #8ec5e8;
        --danger: #f2786e;
        --font: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI",
          Roboto, sans-serif;
        font-family: var(--font);
        color: var(--ink);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        /* Must stay transparent so the OS acrylic behind the window shows
           through. A test asserts on this exact declaration. */
        background: transparent !important;
        overflow: hidden;
        font-family: var(--font);
      }
      /* The mockup's own scrollbar rule: a thin standard bar with a faint
         thumb, NOT a hidden one. The previous build zeroed it with
         ::-webkit-scrollbar, which is why the trial looked different from
         the prototype side by side. */
      .stack {
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.15) transparent;
      }
      .stack::-webkit-scrollbar {
        width: 8px;
      }
      .stack::-webkit-scrollbar-track {
        background: transparent;
      }
      .stack::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.15);
        border-radius: 8px;
      }
      .stack::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.28);
      }
      .dock {
        height: 100vh;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 10px 14px 14px;
        background: var(--glass);
        border: 1px solid var(--glass-line);
        border-radius: 18px;
        box-shadow:
          inset 0 1px 0 var(--glass-hi),
          0 28px 70px rgba(0, 0, 0, 0.45),
          0 2px 8px rgba(0, 0, 0, 0.3);
        overflow: hidden;
      }
      /* Header row: always-visible search plus icon buttons, as in the mockup */
      .top {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 6px;
        /* the mockup's .bar padding, with the top inset tightened so the search
           row sits closer to the top of the panel */
        padding: 6px 0 8px;
      }
      .search {
        flex: 1;
        min-width: 0;
        height: 34px;
        padding: 0 10px;
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.06);
        color: var(--ink);
        font-family: var(--font);
        font-size: 13px;
        outline: none;
        transition:
          background 0.15s,
          border-color 0.15s;
      }
      .search::placeholder {
        color: var(--ink3);
      }
      .search:focus {
        background: rgba(255, 255, 255, 0.09);
        border-color: rgba(255, 255, 255, 0.16);
      }
      .button {
        flex: 0 0 auto;
        width: 30px;
        height: 30px;
        display: grid;
        place-items: center;
        border: 0;
        border-radius: 8px;
        background: none;
        color: var(--ink2);
        font-family: var(--font);
        cursor: pointer;
        transition:
          background 0.15s,
          color 0.15s;
      }
      .button svg {
        width: 16px;
        height: 16px;
        display: block;
        stroke: currentColor;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .button:hover {
        background: rgba(255, 255, 255, 0.08);
        color: var(--ink);
      }
      .quit {
        color: var(--danger);
      }
      .quit:hover {
        background: rgba(242, 120, 110, 0.16);
        color: #f7a39a;
      }
      /* Note cards: full width and always readable. The previous design hid the
         title behind a 42px collapsed tab that expanded on hover, which cannot
         survive in a static card list. */
      .stack {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 7px;
        overflow-y: auto;
        overflow-x: hidden;
        /* padding from the mockup's .list */
        padding: 4px 0 10px;
      }
      .tab {
        position: relative;
        flex: 0 0 auto;
        width: 100%;
        padding: 10px 11px 10px 15px;
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 12px;
        /* --c is set per note and drives both the tint and the colour spine.
           15% matches the mockup's card tint exactly. */
        background: linear-gradient(
          135deg,
          color-mix(in srgb, var(--c, #8ec5e8) 15%, transparent),
          rgba(255, 255, 255, 0.035) 62%
        );
        color: var(--ink);
        cursor: grab;
        transition:
          transform 0.15s,
          border-color 0.15s,
          box-shadow 0.2s;
      }
      .tab::before {
        content: "";
        position: absolute;
        left: 6px;
        top: 10px;
        bottom: 10px;
        width: 3px;
        border-radius: 3px;
        background: var(--c, #8ec5e8);
      }
      .tab:hover {
        border-color: rgba(255, 255, 255, 0.14);
        transform: translateY(-1px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.28);
      }
      .tab:active {
        cursor: grabbing;
      }
      .tab.dragging {
        opacity: 0.55;
        transform: rotate(1deg) scale(1.02);
        box-shadow: 0 14px 30px rgba(0, 0, 0, 0.5);
        cursor: grabbing;
      }
      .tab.drag-over {
        outline: 2px dashed rgba(255, 255, 255, 0.5);
        outline-offset: 2px;
      }
      .tab .inside {
        min-width: 0;
      }
      .title {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: -0.005em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .preview {
        margin-top: 3px;
        font-size: 12px;
        font-style: normal;
        line-height: 1.45;
        color: var(--ink2);
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        white-space: pre-line;
      }
      .tabtime {
        display: block;
        margin-top: 6px;
        font-size: 11px;
        color: var(--ink3);
      }
      .empty {
        margin: auto;
        padding: 24px 12px;
        text-align: center;
        color: var(--ink2);
        font-size: 13px;
      }
      /* Update status row — behaviour untouched, colours moved onto the glass
         palette. A test asserts on id="update". */
      .update {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 10px;
        border: 1px solid var(--glass-line);
        border-radius: 10px;
        background: rgba(20, 20, 23, 0.72);
        color: var(--ink);
        font-size: 11.5px;
        cursor: pointer;
        user-select: none;
      }
      .update[hidden] {
        display: none;
      }
      .update.ready {
        background: rgba(20, 46, 36, 0.78);
      }
      .update.error {
        background: rgba(56, 26, 32, 0.78);
      }
      .update .label {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .update .bar {
        flex: 0 0 46px;
        height: 4px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.14);
        overflow: hidden;
      }
      .update .bar > i {
        display: block;
        width: 0;
        height: 100%;
        border-radius: 2px;
        background: var(--accent);
        transition: width 0.18s ease;
      }
      .update .dismiss {
        flex: 0 0 auto;
        border: 0;
        padding: 0 2px;
        background: transparent;
        color: var(--ink3);
        font-size: 13px;
        line-height: 1;
        cursor: pointer;
      }
      .update .dismiss:hover {
        color: var(--ink);
      }
      /* Footer: note count, mirroring the mockup's .foot */
      .foot {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 8px;
        padding-top: 8px;
        border-top: 1px solid rgba(255, 255, 255, 0.06);
        font-size: 11px;
        color: var(--ink3);
      }
      .foot .count {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .foot .version {
        flex: 0 0 auto;
        opacity: 0.75;
      }
      .foot button {
        flex: 0 0 auto;
        border: 0;
        padding: 0;
        background: none;
        color: var(--ink2);
        font-size: 11px;
        font-family: inherit;
        cursor: pointer;
      }
      .foot button:hover {
        color: var(--ink);
      }
      .typewriter {
        overflow: hidden;
        border-right: 3px solid transparent;
        white-space: nowrap;
        animation: typing 1.5s steps(40, end) 1;
      }

      @keyframes typing {
        from {
          width: 0;
        }
        to {
          width: 100%;
        }
      }
      /* --- Settings panel -------------------------------------------
         Opens over the note list in the same dock, as a sliding overlay, so
         the dock never grows a second window. */
      .sets {
        position: absolute;
        inset: 0;
        z-index: 40;
        display: none;
        flex-direction: column;
        /* Fully opaque on purpose. The settings panel sits directly over the
           note list, so a translucent background made every row unreadable with
           the cards showing through. */
        background: #141417;
        border-radius: 18px;
        overflow: hidden;
      }
      .sets.show {
        display: flex;
        animation: setsin 0.22s cubic-bezier(0.2, 0.9, 0.25, 1);
      }
      @keyframes setsin {
        from {
          opacity: 0;
          transform: translateX(16px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .shead {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 14px 8px;
      }
      .shead h2 {
        margin: 0;
        font-size: 17px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .sbody {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 0 16px 12px;
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.15) transparent;
      }
      .sbody::-webkit-scrollbar {
        width: 8px;
      }
      .sbody::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.15);
        border-radius: 8px;
      }
      .sbody h4 {
        margin: 14px 0 2px;
        font-size: 11px;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--ink3);
      }
      .srow {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 11px 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }
      .srow.col {
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
      }
      .srow b {
        display: block;
        font-size: 13px;
        font-weight: 500;
      }
      .srow small {
        display: block;
        margin-top: 2px;
        font-size: 11.5px;
        line-height: 1.4;
        color: var(--ink3);
      }
      /* A Windows save path is far too long for a 320px row: left unbounded it
         wraps to four lines and shoves the folder button out of alignment. Show
         one truncated line, keep the full path in the tooltip. */
      #saveLocRow > div {
        min-width: 0;
      }
      #saveLocLabel {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        direction: rtl;
        text-align: left;
      }
      /* Segmented control, from the mockup's .seg */
      .seg {
        display: flex;
        flex: none;
        padding: 2px;
        border-radius: 9px;
        background: rgba(255, 255, 255, 0.07);
      }
      .seg button {
        border: 0;
        padding: 5px 11px;
        border-radius: 7px;
        background: none;
        color: var(--ink2);
        font: 500 12px var(--font);
        cursor: pointer;
        white-space: nowrap;
        transition:
          background 0.15s,
          color 0.15s;
      }
      .seg button:hover {
        color: var(--ink);
      }
      .seg button[aria-pressed="true"] {
        background: rgba(255, 255, 255, 0.14);
        color: var(--ink);
      }
      /* Toggle switch, from the mockup's .tog */
      .tog {
        flex: none;
        position: relative;
        width: 42px;
        height: 24px;
        border: 0;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
        cursor: pointer;
        transition: background 0.2s;
      }
      .tog::after {
        content: "";
        position: absolute;
        top: 3px;
        left: 3px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #fff;
        transition: transform 0.2s cubic-bezier(0.2, 0.9, 0.25, 1.05);
      }
      .tog[aria-checked="true"] {
        background: var(--accent);
      }
      .tog[aria-checked="true"]::after {
        transform: translateX(18px);
      }
      .sfoot {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 9px 14px;
        border-top: 1px solid rgba(255, 255, 255, 0.06);
        font-size: 11px;
        color: var(--ink3);
      }
      .sfoot button {
        border: 0;
        padding: 2px 0;
        background: none;
        color: var(--ink2);
        font: 11px var(--font);
        cursor: pointer;
      }
      .sfoot button:hover {
        color: var(--ink);
      }

    </style>
  </head>
  <body>
    <main class="dock">
      <div class="top">
        <input id="search" class="search" placeholder="Search notes…" /><button
          id="new"
          class="button"
          title="New note"
          aria-label="New note"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 5v14M5 12h14" />
          </svg>
        </button
        ><button
          id="hide"
          class="button"
          title="Hide dock"
          aria-label="Hide dock"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15 18l-6-6 6-6" />
          </svg>
        </button
        ><button
          id="quit"
          class="button quit"
          title="Exit Tabbin"
          aria-label="Exit Tabbin"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 6l12 12M18 6 6 18" />
          </svg>
        </button>
      </div>
      <div id="stack" class="stack"></div>
      <div id="update" class="update" hidden></div>
      <div class="foot">
        <span class="count" id="noteCount"></span
        ><button id="feedback" title="Send feedback">Send feedback</button
        ><button id="gear" class="button" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="3" />
            <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" />
          </svg>
        </button
        ><span class="version" id="appVersion"></span>
      </div>

      <!-- Settings opens over the note list inside this same dock window, so the
           dock never needs a second window. -->
      <section class="sets" id="sets" aria-label="Settings">
        <div class="shead">
          <button id="sback" class="button" title="Back to notes" aria-label="Back to notes">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m15 18-6-6 6-6" />
            </svg>
          </button>
          <h2>Settings</h2>
        </div>
        <div class="sbody">
          <h4>Dock</h4>
          <div class="srow">
            <div>
              <b>Dock side</b><small>Which screen edge the dock sticks to</small>
            </div>
            <div class="seg" data-s="edge">
              <button data-v="left">Left</button>
              <button data-v="right">Right</button>
            </div>
          </div>
          <div class="srow">
            <div>
              <b>Auto-hide</b><small>Tuck the dock away when you leave it</small>
            </div>
            <button class="tog" role="switch" data-s="edgeHover" aria-label="Auto-hide"></button>
          </div>
          <div class="srow">
            <div>
              <b>Dock width</b><small>Compact fits more on small screens</small>
            </div>
            <div class="seg" data-s="dockWidth">
              <button data-v="compact">Compact</button>
              <button data-v="roomy">Roomy</button>
            </div>
          </div>
          <h4>Files</h4>
          <div class="srow" id="saveLocRow">
            <div>
              <b>Save location</b><small id="saveLocLabel"></small>
            </div>
            <button id="saveLocBtn" class="button" title="Choose save location" aria-label="Choose save location">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /></svg>
            </button>
          </div>
          <h4>Notes</h4>
          <div class="srow">
            <div>
              <b>Clear all notes</b><small>Deletes every note. Cannot be undone</small>
            </div>
            <button id="clearAll" class="button quit" title="Clear all notes" aria-label="Clear all notes">
              <svg viewBox="0 0 24 24" aria-hidden="true" width="16" height="16"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            </button>
          </div>
        </div>
        <div class="sfoot">
          <span id="sVersion"></span>
          <button id="reset">Reset</button>
        </div>
      </section>
    </main>
    <script>
      let notes = [],
        dragId = null;
      const root = document.querySelector(".dock"),
        stack = document.querySelector("#stack"),
        search = document.querySelector("#search"),
        updateEl = document.querySelector("#update"),
        noteCount = document.querySelector("#noteCount"),
        appVersion = document.querySelector("#appVersion");
      // `action` and `visible` are resolved in the main process so this file
      // never re-derives update policy from status strings.
      function paint(label, opts) {
        opts = opts || {};
        updateEl.hidden = false;
        updateEl.innerHTML = "";
        const text = document.createElement("span");
        text.className = "label";
        text.textContent = label;
        updateEl.appendChild(text);
        if (opts.bar !== undefined) {
          const bar = document.createElement("span");
          bar.className = "bar";
          const fill = document.createElement("i");
          fill.style.width = Math.max(0, Math.min(100, opts.bar)) + "%";
          bar.appendChild(fill);
          updateEl.appendChild(bar);
        }
        if (opts.dismiss) {
          const x = document.createElement("button");
          x.className = "dismiss";
          x.title = "Dismiss";
          x.textContent = "×";
          x.onclick = (e) => {
            e.stopPropagation();
            window.tabbin.dismissUpdateNudge();
          };
          updateEl.appendChild(x);
        }
        updateEl.onclick = opts.onClick || null;
      }
      function renderUpdate(s) {
        if (!s || !s.visible) {
          updateEl.hidden = true;
          updateEl.innerHTML = "";
          updateEl.className = "update";
          updateEl.onclick = null;
          return;
        }
        updateEl.className =
          "update" +
          (s.status === "ready" ? " ready" : s.status === "error" ? " error" : "");
        if (s.status === "unsupported") {
          paint("Portable build can't update itself — install Tabbin-Setup.exe", {
            dismiss: true,
          });
          return;
        }
        if (s.status === "downloading") {
          paint("Downloading " + Math.round(s.percent) + "%", { bar: s.percent });
          return;
        }
        if (s.status === "ready") {
          paint("Restart to install v" + s.availableVersion, {
            onClick: () => window.tabbin.installUpdate(),
          });
          return;
        }
        if (s.status === "error") {
          paint("Update failed — click to retry", {
            onClick: () => window.tabbin.checkForUpdates(),
          });
          return;
        }
        if (s.status === "available") {
          paint("v" + s.availableVersion + " available", {
            onClick: () => window.tabbin.downloadUpdate(),
          });
        }
      }
      function relativeTime(ts) {
        if (!ts) return "";
        const mins = Math.floor((Date.now() - ts) / 60000);
        if (mins < 1) return "Just now";
        if (mins < 60) return mins + "m ago";
        const hours = Math.floor(mins / 60);
        if (hours < 24) return hours + "h ago";
        const days = Math.floor(hours / 24);
        if (days < 7) return days + "d ago";
        return new Date(ts).toLocaleDateString(undefined, {
          month: "short",
          day: "numeric",
        });
      }
      function render() {
        const q = search.value.trim().toLowerCase();
        stack.innerHTML = "";
        const shown = notes.filter((n) =>
          (n.title + " " + n.content).toLowerCase().includes(q),
        );
        noteCount.textContent =
          notes.length +
          (notes.length === 1 ? " note" : " notes") +
          (shown.length !== notes.length ? " · " + shown.length + " shown" : "");
        if (!shown.length) {
          stack.innerHTML = q
            ? '<div class="empty">No notes match your search.</div>'
            : '<div class="empty">No notes yet.</div>';
          return;
        }
        shown.forEach((n) => {
          const el = document.createElement("article");
          el.className = "tab";
          el.draggable = true;
          el.dataset.id = n.id;
          // --c drives both the card tint and the leading colour spine. The note
          // body is no longer painted with the note colour, so the previous
          // luminance-based contrast helper is gone.
          el.style.setProperty("--c", n.color);
          el.innerHTML =
            '<div class="inside"><div class="title"></div><div class="preview"></div><span class="tabtime"></span></div>';
          el.querySelector(".title").textContent = n.title || "Untitled note";
          el.querySelector(".preview").textContent = (n.content || "Empty note")
            .replace(/<[^>]*>/g, "")
            .slice(0, 160);
          el.querySelector(".tabtime").textContent = relativeTime(n.updatedAt);
          // Keep the typewriter reveal on the preview, as before.
          el.querySelector(".preview").classList.add("typewriter");
          el.querySelector(".preview").style.animationDelay = "0.1s";

          el.onclick = () => {
            if (!dragId) window.tabbin.open(n.id);
          };
          el.ondragstart = (e) => {
            dragId = n.id;
            el.classList.add("dragging");
            e.dataTransfer.effectAllowed = "move";
            e.dataTransfer.setData("text/plain", n.id);
          };
          el.ondragend = () => {
            dragId = null;
            el.classList.remove("dragging");
            document
              .querySelectorAll(".drag-over")
              .forEach((x) => x.classList.remove("drag-over"));
          };
          el.ondragover = (e) => {
            e.preventDefault();
            if (dragId && dragId !== n.id) el.classList.add("drag-over");
          };
          el.ondragleave = () => el.classList.remove("drag-over");
          el.ondrop = (e) => {
            e.preventDefault();
            el.classList.remove("drag-over");
            const from = notes.findIndex((x) => x.id === dragId),
              to = notes.findIndex((x) => x.id === n.id);
            if (from < 0 || to < 0 || from === to) return;
            const moved = notes.splice(from, 1)[0];
            notes.splice(to, 0, moved);
            window.tabbin.reorder(notes.map((x) => x.id));
            render();
          };
          stack.appendChild(el);
        });
      }
      search.oninput = render;
      document.querySelector("#new").onclick = () => window.tabbin.create();
      document.querySelector("#hide").onclick = (e) => {
        e.stopPropagation();
        window.tabbin.hide();
      };
      document.querySelector("#quit").onclick = () => window.tabbin.quit();
      document.querySelector("#feedback").onclick = () =>
        window.open("https://github.com/Vanz15/tabbin/issues/new/choose", "_blank");
      root.addEventListener("mouseleave", () => window.tabbin.cursorLeft());
      // Ctrl K focuses search and Escape clears it, both from the mockup.
      document.addEventListener("keydown", (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
          e.preventDefault();
          search.focus();
          search.select();
        } else if (e.key === "Escape" && document.activeElement === search) {
          search.value = "";
          render();
          search.blur();
        }
      });
      // --- Settings -------------------------------------------------
      // Opens as an overlay inside this dock, not a second window. Values are
      // persisted through the main process so the dock re-lays out immediately.
      const sets = document.querySelector("#sets"),
        sVersion = document.querySelector("#sVersion");
      let cfg = { edge: "left", edgeHover: true, dockWidth: "roomy", saveLocation: "same" };
      // The main process owns these values and re-lays out the window, so the
      // renderer only mirrors them. No renderer-side blur or palette swatches:
      // those controls were removed so the settings surface stays legible and
      // the new-note colour stays a note-window affordance only.
      function applyCfg() {
        root.classList.toggle("right", cfg.edge === "right");
        document.querySelectorAll(".seg[data-s]").forEach((seg) => {
          const key = seg.dataset.s;
          seg.querySelectorAll("button").forEach((btn) => {
            btn.setAttribute("aria-pressed", String(cfg[key] === btn.dataset.v));
          });
        });
        document.querySelectorAll(".tog[data-s]").forEach((tog) => {
          tog.setAttribute("aria-checked", String(!!cfg[tog.dataset.s]));
        });
        updateSaveLocationLabel();
      }
      async function patchCfg(patch) {
        cfg = await window.tabbin.setConfig(patch);
        applyCfg();
        return cfg;
      }
      // Show the folder notes are actually saved in right now. The main process
      // resolves it per call (notesDir in main.js), so this is the live path, not
      // a stored preference — which is what makes it useful after a folder change.
      function updateSaveLocationLabel() {
        const label = document.querySelector("#saveLocLabel");
        const path = cfg.notesPath || "Unknown location";
        // direction:rtl in CSS keeps the folder NAME visible when the line is
        // truncated, which is the part a user actually recognises.
        label.textContent = path;
        label.title = path;
        document.querySelector("#saveLocRow").title = path;
      }
      document.querySelector("#gear").onclick = () => {
        sets.classList.add("show");
        render();
      };
      document.querySelector("#sback").onclick = () => sets.classList.remove("show");
      document.querySelectorAll(".seg[data-s]").forEach((seg) => {
        seg.onclick = (e) => {
          const btn = e.target.closest("button[data-v]");
          if (!btn) return;
          patchCfg({ [seg.dataset.s]: btn.dataset.v });
        };
      });
      document.querySelectorAll(".tog[data-s]").forEach((tog) => {
        tog.onclick = () => patchCfg({ [tog.dataset.s]: !cfg[tog.dataset.s] });
      });
      document.querySelector("#reset").onclick = async () => {
        cfg = await window.tabbin.setConfig({
          edge: "left",
          edgeHover: true,
          dockWidth: "roomy",
          saveLocation: "same",
        });
        applyCfg();
      };
      document.querySelector("#saveLocBtn").onclick = async () => {
        const dir = await window.tabbin.pickFolder();
        if (!dir) return;
        cfg = await window.tabbin.setConfig({ saveLocation: dir });
        applyCfg();
      };
      document.querySelector("#clearAll").onclick = async () => {
        if (confirm("Delete all " + (notes.length) + " notes? This cannot be undone.")) {
          const result = await window.tabbin.clear(true);
          if (result && result.cleared !== undefined) sets.classList.remove("show");
        }
      };
      window.tabbin.config().then((c) => {
        cfg = { ...cfg, ...c };
        applyCfg();
      });
      window.tabbin.onConfigChanged((c) => {
        cfg = { ...cfg, ...c };
        applyCfg();
      });
      window.tabbin.onChanged((x) => {
        notes = x;
        render();
      });
      window.tabbin.list().then((x) => {
        notes = x;
        render();
      });
      window.tabbin.onUpdateState(renderUpdate);
      // Pull as well as subscribe: an update can be discovered before this
      // renderer finishes loading, and a push-only listener would miss it.
      window.tabbin.updateStatus().then((s) => {
        if (s && s.currentVersion) appVersion.textContent = "v" + s.currentVersion;
        renderUpdate(s);
      });
    </script>
  </body>
</html>

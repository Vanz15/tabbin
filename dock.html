<!doctype html><html><head><meta charset="UTF-8"><title>Tabbin</title><style>:root{font-family:Inter,Segoe UI,sans-serif;color:#f5f5f7}*{box-sizing:border-box}html,body{margin:0;background:transparent!important;overflow:hidden;font-family:Inter,Segoe UI,sans-serif}.dock{height:100vh;padding:18px 18px 18px 12px;display:flex;flex-direction:column;align-items:flex-start;background:transparent!important;border-radius:18px}.dock.right{align-items:flex-end;padding:18px 12px 18px 18px}.top{width:100%;display:flex;justify-content:flex-start;gap:6px;margin-bottom:14px;background:transparent}.right .top{justify-content:flex-end}.search{width:0;opacity:0;transition:opacity 320ms ease,width 360ms cubic-bezier(.22,1,.36,1);padding:8px 10px;border:1px solid #ffffff2a;border-radius:12px;background:#1e2130cc;color:white;outline:none}.dock:hover .search{width:190px;opacity:1}.button{border:0;border-radius:10px;background:transparent;color:white;font-size:18px;width:34px;height:34px;cursor:pointer}.button:hover{background:#ffffff18}.quit{color:#ffaaa8}.stack{position:relative;flex:1;width:100%;overflow-y:auto;overflow-x:visible;padding:4px 0 60px;scrollbar-width:none;background:transparent}.stack::-webkit-scrollbar{width:0;height:0}.tab{position:relative;margin:0 auto 6px 0;width:42px;min-height:30px;border-radius:4px 10px 10px 4px;cursor:grab;transition:width 360ms cubic-bezier(.22,1,.36,1),box-shadow 360ms ease;z-index:1;overflow:hidden;box-shadow:none}.tab:active{cursor:grabbing}.tab:hover{width:300px;z-index:20}.tab.dragging{opacity:.45}.tab.drag-over{outline:2px dashed #fff;outline-offset:2px}.right .tab{margin-left:auto;margin-right:0;border-radius:10px 4px 4px 10px}.tab .inside{padding:7px 10px;min-height:30px}.title{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.preview{font-size:11px;line-height:1.3;margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}.tab:not(:hover) .title,.tab:not(:hover) .preview{visibility:hidden}.empty{color:#ffffff88;padding:20px;font-size:13px}.hint{position:absolute;bottom:14px;left:14px;color:#ffffff55;font-size:11px}.right .hint{left:auto;right:14px}</style></head><body><main class="dock"><div class="top"><input id="search" class="search" placeholder="Search notes…"><button id="new" class="button" title="New note">+</button><button id="hide" class="button" title="Hide dock">👁</button><button id="quit" class="button quit" title="Exit Tabbin">×</button></div><div id="stack" class="stack"></div><div class="hint">move to edge to reveal · drag to reorder</div></main><script>let notes=[],dragId=null;const root=document.querySelector('.dock'),stack=document.querySelector('#stack'),search=document.querySelector('#search');function render(){const q=search.value.toLowerCase();stack.innerHTML='';const shown=notes.filter(n=>(n.title+' '+n.content).toLowerCase().includes(q));if(!shown.length){stack.innerHTML='<div class="empty">No notes yet</div>';return}shown.forEach(n=>{const el=document.createElement('article');el.className='tab';el.draggable=true;el.dataset.id=n.id;el.style.background=n.color;el.innerHTML='<div class="inside"><div class="title"></div><div class="preview"></div></div>';el.querySelector('.title').textContent=n.title||'Untitled note';el.querySelector('.preview').textContent=(n.content||'Empty note').replace(/<[^>]*>/g,'').slice(0,120);el.onclick=()=>{if(!dragId)window.tabbin.open(n.id)};el.ondragstart=e=>{dragId=n.id;el.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',n.id)};el.ondragend=()=>{dragId=null;el.classList.remove('dragging');document.querySelectorAll('.drag-over').forEach(x=>x.classList.remove('drag-over'))};el.ondragover=e=>{e.preventDefault();if(dragId&&dragId!==n.id)el.classList.add('drag-over')};el.ondragleave=()=>el.classList.remove('drag-over');el.ondrop=e=>{e.preventDefault();el.classList.remove('drag-over');const from=notes.findIndex(x=>x.id===dragId),to=notes.findIndex(x=>x.id===n.id);if(from<0||to<0||from===to)return;const moved=notes.splice(from,1)[0];notes.splice(to,0,moved);window.tabbin.reorder(notes.map(x=>x.id));render()};stack.appendChild(el)})}search.oninput=render;document.querySelector('#new').onclick=()=>window.tabbin.create();document.querySelector('#hide').onclick=e=>{e.stopPropagation();window.tabbin.hide()};document.querySelector('#quit').onclick=()=>window.tabbin.quit();root.addEventListener('mouseleave',()=>window.tabbin.cursorLeft());window.tabbin.onChanged(x=>{notes=x;render()});window.tabbin.list().then(x=>{notes=x;render()});</script></body></html>
